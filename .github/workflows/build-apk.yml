name: Build APK • Thamis Mibro

on:
  push:
    branches: [ main ]
    paths:
      - 'android-mibro/**'
      - 'web/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK 35
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Validar JavaScript
        run: node --check web/app.js && node --check web/config.js && node --check web/sw.js

      - name: Compilar APK
        run: gradle -p android-mibro assembleDebug --no-daemon --stacktrace

      - name: Preparar artefatos
        run: |
          cp android-mibro/app/build/outputs/apk/debug/app-debug.apk atletIA-Mibro-Thamis-v1.0.0.apk
          sha256sum atletIA-Mibro-Thamis-v1.0.0.apk > atletIA-Mibro-Thamis-v1.0.0.sha256

      - name: Guardar artefato da execução
        uses: actions/upload-artifact@v4
        with:
          name: atletIA-Mibro-Thamis-v1.0.0
          path: |
            atletIA-Mibro-Thamis-v1.0.0.apk
            atletIA-Mibro-Thamis-v1.0.0.sha256

      - name: Publicar Release de teste
        uses: softprops/action-gh-release@v2
        with:
          tag_name: thamis-mibro-v1.0.0-build-${{ github.run_number }}
          name: atletIA Mibro • Thamis v1.0.0 • build ${{ github.run_number }}
          prerelease: true
          files: |
            atletIA-Mibro-Thamis-v1.0.0.apk
            atletIA-Mibro-Thamis-v1.0.0.sha256
          body: |
            Build automático do aplicativo dedicado da Thamis.

            Instalação:
            1. Instale o APK.
            2. Entre com o mesmo login do atletIA Live.
            3. Habilite as notificações de "atletIA Mibro • Thamis" no Mibro Fit.
            4. Use "TESTAR ALERTA NO MIBRO" antes do primeiro treino.
