name: Build APK • Thamis Mibro

on:
  push:
    branches: [ main ]
    paths:
      - 'android-mibro/**'
      - 'web/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

concurrency:
  group: thamismibro-apk-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Definir versão
        id: version
        shell: bash
        run: |
          VERSION_CODE=$((200000 + GITHUB_RUN_NUMBER))
          VERSION_NAME="1.2.${GITHUB_RUN_NUMBER}"
          APK_NAME="atletIA-Mibro-Thamis-v${VERSION_NAME}.apk"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "ATLETIA_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "ATLETIA_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Preparar assinatura definitiva
        id: signing
        shell: bash
        env:
          SIGNING_BUNDLE: ${{ secrets.ANDROID_SIGNING_BUNDLE }}
        run: |
          if [ -z "$SIGNING_BUNDLE" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_SIGNING_BUNDLE ainda não configurado. Será feito apenas build de diagnóstico; nenhuma Release atualizável será publicada."
            exit 0
          fi

          python3 - <<'PY'
          import os, json, base64
          bundle = json.loads(base64.b64decode(os.environ["SIGNING_BUNDLE"]).decode("utf-8"))
          ks = os.path.join(os.environ["RUNNER_TEMP"], "ThamisMibro-release.jks")
          with open(ks, "wb") as f:
              f.write(base64.b64decode(bundle["keystoreBase64"]))
          values = {
              "ANDROID_KEYSTORE_PATH": ks,
              "ANDROID_KEYSTORE_PASSWORD": bundle["storePassword"],
              "ANDROID_KEY_ALIAS": bundle["alias"],
              "ANDROID_KEY_PASSWORD": bundle["keyPassword"],
          }
          for v in values.values():
              print(f"::add-mask::{v}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              for k, v in values.items():
                  env.write(f"{k}={v}\n")
          PY
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Validar JavaScript
        run: node --check web/app.js && node --check web/config.js && node --check web/sw.js

      - name: Compilar APK definitivo assinado
        if: steps.signing.outputs.signed == 'true'
        run: gradle -p android-mibro assembleRelease --no-daemon --stacktrace

      - name: Compilar diagnóstico sem assinatura definitiva
        if: steps.signing.outputs.signed != 'true'
        run: gradle -p android-mibro assembleDebug --no-daemon --stacktrace

      - name: Preparar APK definitivo
        if: steps.signing.outputs.signed == 'true'
        shell: bash
        run: |
          cp android-mibro/app/build/outputs/apk/release/app-release.apk "${{ steps.version.outputs.apk_name }}"
          sha256sum "${{ steps.version.outputs.apk_name }}" > "atletIA-Mibro-Thamis-v${{ steps.version.outputs.version_name }}.sha256"

      - name: Preparar APK de diagnóstico
        if: steps.signing.outputs.signed != 'true'
        shell: bash
        run: |
          cp android-mibro/app/build/outputs/apk/debug/app-debug.apk "DIAGNOSTICO-assinatura-nao-configurada.apk"

      - name: Guardar APK definitivo
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: atletIA-Mibro-Thamis-v${{ steps.version.outputs.version_name }}
          path: |
            ${{ steps.version.outputs.apk_name }}
            atletIA-Mibro-Thamis-v${{ steps.version.outputs.version_name }}.sha256

      - name: Guardar diagnóstico
        if: steps.signing.outputs.signed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: CONFIGURE-ANDROID-SIGNING-BUNDLE
          path: DIAGNOSTICO-assinatura-nao-configurada.apk
          retention-days: 3

      - name: Publicar Release atualizável
        if: steps.signing.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: thamis-mibro-build-${{ github.run_number }}
          name: atletIA Mibro • Thamis v${{ steps.version.outputs.version_name }}
          prerelease: false
          make_latest: true
          files: |
            ${{ steps.version.outputs.apk_name }}
            atletIA-Mibro-Thamis-v${{ steps.version.outputs.version_name }}.sha256
          body: |
            VERSION_CODE=${{ steps.version.outputs.version_code }}
            VERSION_NAME=${{ steps.version.outputs.version_name }}

            APK definitivo assinado do atletIA Mibro da Thamis.

            A partir desta linha de assinatura, o próprio aplicativo verifica esta Release ao abrir,
            valida SHA-256 + applicationId + certificado e instala versões mais novas.
